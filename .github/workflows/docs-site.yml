name: Docs Site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'schemas/**'
      - 'scripts/build-docs-site.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to render as latest, for example v0.8.0.
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: false
        default: ''
        type: string
      data_artifact_name:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download generated release data
        if: ${{ inputs.data_artifact_name }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.data_artifact_name }}
          path: .

      - name: Build docs site
        env:
          DOCS_RELEASE_TAG: ${{ inputs.release_tag }}
        run: pnpm docs:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload docs site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy docs site
        id: deployment
        uses: actions/deploy-pages@v4
