name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Lint
        run: pnpm lint

      - name: Formatter Check
        run: pnpm format:check

      - name: Derive release metadata
        id: release_meta
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate Wikipedia datasets
        run: |
          mkdir -p release-baseline
          if [ -f data-output/all-seasons.json ]; then
            cp data-output/all-seasons.json release-baseline/all-seasons.previous.json
          else
            printf '%s\n' '{"seasons":{}}' > release-baseline/all-seasons.previous.json
          fi
          rm -rf data-output
          mkdir -p data-output
          pnpm wiki:build:overview
          pnpm wiki:build:combined
          pnpm wiki:club-seed
          pnpm -s verify:data
          pnpm wiki:minify:combined
          pnpm wiki:minify:overview
          pnpm exec node wikipedia/data/compare-football-data.js --json ./release-baseline/all-seasons.previous.json ./data-output/all-seasons.json > ./data-output/release-diff.json
          pnpm exec node wikipedia/data/compare-football-data.js --markdown ./release-baseline/all-seasons.previous.json ./data-output/all-seasons.json > ./data-output/release-diff.md
          pnpm exec node wikipedia/data/build-release-notes.js \
            --tag "${{ steps.release_meta.outputs.tag }}" \
            --diff ./data-output/release-diff.json \
            --current ./data-output/all-seasons.json \
            --club-metadata ./data/club-metadata.json \
            --manual "./docs/release-notes/${{ steps.release_meta.outputs.tag }}.md" \
            --output ./data-output/release-notes.md

      - name: Archive generated data
        run: |
          mkdir -p release-assets
          cp data-output/all-seasons.json release-assets/all-seasons.json
          cp data-output/all-seasons.min.json release-assets/all-seasons.min.json
          cp data-output/wiki_overview_tables_by_season.json release-assets/wiki_overview_tables_by_season.json
          cp data-output/wiki_overview_tables_by_season.min.json release-assets/wiki_overview_tables_by_season.min.json
          cp data-output/release-diff.json release-assets/release-diff.json
          cp data-output/release-diff.md release-assets/release-diff.md
          cp data-output/release-notes.md release-assets/release-notes.md
          cp data/club-metadata.json release-assets/club-metadata.json
          zip -r "release-assets/footy-data-kit-${{ steps.release_meta.outputs.tag }}-data.zip" data-output data/club-metadata.json

      - name: Upload docs site data
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-data
          path: |
            data-output
            data/club-metadata.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Release ${{ steps.release_meta.outputs.tag }}
          body_path: ./data-output/release-notes.md
          files: |
            release-assets/all-seasons.json
            release-assets/all-seasons.min.json
            release-assets/wiki_overview_tables_by_season.json
            release-assets/wiki_overview_tables_by_season.min.json
            release-assets/club-metadata.json
            release-assets/release-diff.json
            release-assets/release-diff.md
            release-assets/release-notes.md
            release-assets/footy-data-kit-${{ steps.release_meta.outputs.tag }}-data.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    needs: release
    uses: ./.github/workflows/docs-site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      release_tag: ${{ needs.release.outputs.tag }}
      data_artifact_name: docs-site-data
