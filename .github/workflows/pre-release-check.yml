name: Pre-release Check

on:
  pull_request:
    branches:
      - main

jobs:
  pre-release-check:
    if: startsWith(github.head_ref, 'pre-release/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive release metadata
        id: release_meta
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^pre-release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected pre-release/x.y.z branch, got: $HEAD_REF" >&2
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"

          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "package.json version ($PACKAGE_VERSION) does not match branch version ($VERSION)" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        run: pnpm -s release-notes:check --tag "${{ steps.release_meta.outputs.tag }}"

      - name: Verify generated docs are current
        run: pnpm -s docs:check

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Formatter check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Dry-run release data rebuild
        run: pnpm -s release:dry-run-data
